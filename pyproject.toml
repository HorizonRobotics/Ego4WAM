[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "starVLA"
authors = [
    {name = "Ego4WAM Team"},
    {name = "Jinhui Ye", email="jinhuiyes@gmail.com"},
    {name = "Fangjing Wang", email="fangjing_wang@outlook.com"},
    {name = "Junqiu Yu", email="michaelyu1101@163.com"},

]
description = "Ego4WAM: RoboDojo post-training and local evaluation on StarVLA infrastructure."
version = "1.0.1"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["vision-language-actions models", " robotic manipulation", "multimodal pretraining", "robot learning", "generative models"]
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "LICENSES/*.txt",
    "examples/simBenchmarks/RoboDojo/eval_files_ego4wam/patches/*-LICENSE",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
"Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff>=0.2.2",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["starVLA*", "deployment*", "examples*"]
exclude = [
    "tests",         # test directory
    "tests.*",
    "cache",         # cache directory
    "cache.*",
    "playground",    # playground directory (contains symlinks to Datasets, Models)
    "playground.*",
    "results",       # result directory
    "results.*",
    "checkpoints",   # model checkpoint
    "checkpoints.*",
    "scripts",       # script directory
    "scripts.*",
    "eval",          # evaluation related directory
    "eval.*",
    "assets",        # assets directory
    "assets.*",
    "**bar**",           # bar directory
    "bar.*",
    ".vscode",       # VS Code configuration directory
    "*.egg-info",    # egg-info metadata directory
    "**__pycache__**",   # Python cache directory
    "*.pyc",         # compiled Python file
    "*.pyo",         # optimized Python file
    "starVLA.egg-info",
    "starVLA.egg-info.*",
    "starVLA.config",
    "starVLA.config.*",
]

[tool.setuptools.package-data]
"starVLA.dataloader.ego4wam" = ["assets/*.json", "assets/*.urdf", "assets/*.license"]
"starVLA.training.trainer_utils" = ["assets/*.txt"]

[tool.black]
line-length = 121
target-version = ["py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
